name: docker-foundations-lab

services:
  web:
    build:
      context: .
    image: docker-foundations-lab:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  probe:
    image: alpine:3.22
    profiles: ["tools"]
    command: ["wget", "-qO-", "http://web:8080/health"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  evidence-writer:
    image: alpine:3.22
    profiles: ["tools"]
    command:
      - sh
      - -c
      - printf 'volume persistence verified at %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /evidence/proof.txt
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - evidence:/evidence

  evidence-reader:
    image: alpine:3.22
    profiles: ["tools"]
    command: ["cat", "/evidence/proof.txt"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - evidence:/evidence:ro

networks:
  app:
    driver: bridge

volumes:
  evidence:
