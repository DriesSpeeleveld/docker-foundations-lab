name: docker-foundations-lab

services:
  website:
    build:
      context: .
    image: docker-foundations-lab:local
    ports:
      - "127.0.0.1:${WEBPOORT:-8080}:8080"
    networks:
      - labnetwerk
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  controle:
    image: alpine:3.22
    profiles: ["hulpmiddelen"]
    command: ["wget", "-qO-", "http://website:8080/health"]
    depends_on:
      website:
        condition: service_healthy
    networks:
      - labnetwerk
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bewijs-schrijver:
    image: alpine:3.22
    profiles: ["hulpmiddelen"]
    command:
      - sh
      - -c
      - printf 'volumepersistentie gecontroleerd op %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /bewijs/bewijs.txt
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - bewijs:/bewijs

  bewijs-lezer:
    image: alpine:3.22
    profiles: ["hulpmiddelen"]
    command: ["cat", "/bewijs/bewijs.txt"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - bewijs:/bewijs:ro

networks:
  labnetwerk:
    driver: bridge

volumes:
  bewijs:
