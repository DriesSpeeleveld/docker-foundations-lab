name: controleren

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  docker-lab-controleren:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Docker-versies tonen
        run: |
          docker version
          docker compose version

      - name: Labtests uitvoeren
        run: bash scripts/test-lab.sh
