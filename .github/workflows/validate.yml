name: validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  docker-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run lab tests
        run: bash scripts/test.sh
